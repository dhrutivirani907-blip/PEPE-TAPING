<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PEPE Tapping Game & Admin</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0e12;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
    }

    /* Header & Balance */
    .header {
      margin-top: 10px;
      text-align: center;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      color: #8E8E93;
      letter-spacing: 1px;
    }

    .balance-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    .balance {
      font-size: 36px;
      font-weight: 800;
    }

    .level-badge {
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      color: #34C759;
      margin-top: 6px;
    }

    /* Tap Area */
    .tap-area {
      position: relative;
      margin: 40px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .tap-button {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, #2c2c2e 0%, #1c1c1e 100%);
      border: 4px solid #34C759;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 30px rgba(52, 199, 89, 0.3);
      cursor: pointer;
      transition: transform 0.05s ease;
    }

    .tap-button:active {
      transform: scale(0.95);
    }

    .tap-button img {
      width: 140px;
      height: 140px;
      pointer-events: none;
    }

    /* Floating +1 Text Animation */
    .floating-text {
      position: absolute;
      font-size: 28px;
      font-weight: bold;
      color: #34C759;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-80px); }
    }

    /* Progress & Energy */
    .progress-container {
      width: 100%;
      margin-bottom: 20px;
    }

    .energy-text {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #8E8E93;
      margin-bottom: 6px;
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      background: #1c1c1e;
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #34C759;
      width: 100%;
      transition: width 0.1s ease;
    }

    /* Action Buttons */
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .btn {
      background: #1c1c1e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active { background: #2c2c2e; }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #1c1c1e;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close-btn {
      font-size: 24px;
      color: #8E8E93;
      cursor: pointer;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      color: #8E8E93;
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      background: #2c2c2e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: white;
      font-size: 14px;
      outline: none;
    }

    .submit-btn {
      width: 100%;
      background: #34C759;
      color: black;
      font-weight: bold;
      padding: 14px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    /* Admin View Specifics */
    #admin-view {
      display: none;
      width: 100%;
      max-width: 500px;
      padding: 20px;
    }

    .admin-card {
      background: #1c1c1e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .admin-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .user-id { font-weight: bold; color: #fff; }
    .amount-display { font-size: 18px; font-weight: bold; color: #34C759; margin: 8px 0; }
    .status-badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
    .status-badge.pending { background: rgba(255, 149, 0, 0.2); color: #ff9500; }
    .status-badge.approved, .status-badge.Approved { background: rgba(52, 199, 89, 0.2); color: #34C759; }
    .status-badge.rejected, .status-badge.Rejected { background: rgba(255, 59, 48, 0.2); color: #ff3b30; }

    .admin-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .action-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .approve-btn { background: #34C759; color: #000; }
    .reject-btn { background: #ff3b30; color: #fff; }
  </style>
</head>
<body>

  <!-- User Game View -->
  <div id="user-view" class="app-container">
    <div class="header">
      <div class="title">PEPE TAPPING</div>
      <div class="balance-container">
        <span class="balance" id="balance-display">0</span>
      </div>
      <div class="level-badge">Bronze Level</div>
    </div>

    <div class="tap-area">
      <div class="tap-button" id="tap-btn">
        <img src="https://cryptologos.cc/logos/pepe-pepe-logo.png" alt="PEPE">
      </div>
    </div>

    <div class="progress-container">
      <div class="energy-text">
        <span>⚡ Energy</span>
        <span id="energy-display">1000 / 1000</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="energy-bar"></div>
      </div>
    </div>

    <div class="actions-grid">
      <button class="btn" onclick="openModal('withdraw-modal')">💸 Withdraw</button>
      <button class="btn" onclick="alert('Earn feature coming soon!')">🎯 Earn</button>
    </div>
  </div>

  <!-- Admin View -->
  <div id="admin-view">
    <h2 style="margin-bottom: 20px; text-align: center;">Withdrawal Requests</h2>
    <div id="admin-requests-list">Loading...</div>
  </div>

  <!-- Withdrawal Modal -->
  <div class="modal" id="withdraw-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Withdraw PEPE</h3>
        <span class="close-btn" onclick="closeModal('withdraw-modal')">&times;</span>
      </div>
      <div class="input-group">
        <label>Binance Pay ID / Wallet</label>
        <input type="text" id="binance-id-input" placeholder="e.g. 123456789">
      </div>
      <div class="input-group">
        <label>Amount (PEPE Tokens)</label>
        <input type="number" id="withdraw-amount-input" placeholder="Min 10,000">
      </div>
      <button class="submit-btn" onclick="submitWithdrawal()">Submit Request</button>
    </div>
  </div>

  <script>
    const BACKEND_URL = "https://pepe-backend-wkym.onrender.com";

    // LocalStorage Keys
    let balance = parseInt(localStorage.getItem('pepe_balance')) || 0;
    let energy = parseInt(localStorage.getItem('pepe_energy')) || 1000;
    const maxEnergy = 1000;

    // DOM Elements
    const balanceDisplay = document.getElementById('balance-display');
    const energyDisplay = document.getElementById('energy-display');
    const energyBar = document.getElementById('energy-bar');
    const tapBtn = document.getElementById('tap-btn');

    updateUI();

    // Tapping Event
    tapBtn.addEventListener('click', (e) => {
      if (energy <= 0) return;

      balance += 1;
      energy -= 1;

      saveState();
      updateUI();
      createFloatingText(e);
    });

    // Energy Regenerate (1 per sec)
    setInterval(() => {
      if (energy < maxEnergy) {
        energy += 1;
        saveState();
        updateUI();
      }
    }, 1000);

    function updateUI() {
      balanceDisplay.innerText = balance.toLocaleString();
      energyDisplay.innerText = `${energy} / ${maxEnergy}`;
      energyBar.style.width = `${(energy / maxEnergy) * 100}%`;
    }

    function saveState() {
      localStorage.setItem('pepe_balance', balance);
      localStorage.setItem('pepe_energy', energy);
    }

    function createFloatingText(e) {
      const rect = tapBtn.getBoundingClientRect();
      const floatText = document.createElement('div');
      floatText.className = 'floating-text';
      floatText.innerText = '+1';
      floatText.style.left = `${e.clientX - rect.left}px`;
      floatText.style.top = `${e.clientY - rect.top}px`;

      tapBtn.appendChild(floatText);
      setTimeout(() => floatText.remove(), 800);
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // ---------------- WITHDRAWAL SUBMISSION ----------------
    async function submitWithdrawal() {
      const binanceId = document.getElementById('binance-id-input').value.trim();
      const amount = parseInt(document.getElementById('withdraw-amount-input').value);

      if (!binanceId) return alert('Please enter Binance Pay ID');
      if (!amount || amount < 10000) return alert('Minimum withdrawal is 10,000 PEPE');
      if (amount > balance) return alert('Insufficient balance!');

      // Get or Generate unique User ID
      let userId = localStorage.getItem('user_id');
      if (!userId) {
        userId = 'USER_' + Math.floor(100000 + Math.random() * 900000);
        localStorage.setItem('user_id', userId);
      }

      try {
        const response = await fetch(`${BACKEND_URL}/api/withdraw`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: userId,
            binanceId: binanceId,
            wallet: binanceId,
            amount: amount,
            app: 'PEPE',
            type: 'PEPE'
          })
        });

        const data = await response.json();

        if (data.success) {
          balance -= amount;
          saveState();
          updateUI();
          closeModal('withdraw-modal');
          alert('PEPE withdrawal request submitted successfully!');
          document.getElementById('binance-id-input').value = '';
          document.getElementById('withdraw-amount-input').value = '';
        } else {
          alert('Error: ' + data.message);
        }
      } catch (error) {
        console.error("Submit error:", error);
        alert('Server Connection Error');
      }
    }

    // ---------------- ADMIN PANEL LOGIC ----------------
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('admin') === 'true') {
      document.getElementById('user-view').style.display = 'none';
      document.getElementById('admin-view').style.display = 'block';
      fetchAdminRequests();
    }

    async function fetchAdminRequests() {
      try {
        const res = await fetch(`${BACKEND_URL}/api/withdrawals`);
        const requests = await res.json();
        renderAdminRequests(requests);
      } catch (err) {
        console.error("Fetch Admin Error:", err);
        document.getElementById('admin-requests-list').innerText = 'Failed to load requests.';
      }
    }

    function renderAdminRequests(requests) {
      const container = document.getElementById('admin-requests-list');
      
      if (!requests || requests.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 20px; color: #8E8E93;">No pending requests</div>';
        return;
      }

      container.innerHTML = requests.map(req => {
        const walletDisplay = req.wallet || req.binance_id || req.binanceId || 'N/A';
        const currentStatus = req.status || 'Pending';

        // Dynamic App Name Read from DB (fallback to PEPE if empty)
        const rawApp = req.app || req.type || req.appName || 'PEPE';
        const appLabel = rawApp.toString().toUpperCase().trim();

        // Dynamic Colors for App Badge
        let badgeColor = '#34C759'; // Green for PEPE
        if (appLabel.includes('BONK')) {
          badgeColor = '#FF9500';  // Orange for BONK
        }

        return `
          <div class="admin-card">
            <div class="admin-card-header">
              <div style="display: flex; align-items: center; gap: 8px;">
                <span class="user-id">ID: ${walletDisplay}</span>
                <span style="
                  background-color: ${badgeColor}; 
                  color: #000; 
                  font-size: 11px; 
                  font-weight: bold; 
                  padding: 2px 8px; 
                  border-radius: 6px;
                  text-transform: uppercase;">
                  ${appLabel}
                </span>
              </div>
              <span class="status-badge ${currentStatus.toLowerCase()}">${currentStatus}</span>
            </div>
            
            <div class="amount-display">${Number(req.amount).toLocaleString()} ${appLabel}</div>
            
            ${currentStatus.toLowerCase() === 'pending' ? `
              <div class="admin-actions">
                <button class="action-btn approve-btn" onclick="updateStatus(${req.id}, 'Approved')">✓ Approve</button>
                <button class="action-btn reject-btn" onclick="updateStatus(${req.id}, 'Rejected')">✕ Reject</button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    async function updateStatus(id, newStatus) {
      try {
        const res = await fetch(`${BACKEND_URL}/api/withdrawals/update-status`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, status: newStatus })
        });
        const data = await res.json();
        if (data.success) {
          fetchAdminRequests();
        } else {
          alert('Failed: ' + data.message);
        }
      } catch (err) {
        alert('Failed to update status');
      }
    }
  </script>
</body>
</html>
