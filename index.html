<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PEPE Tapping Game & Admin</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0e12;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
    }

    /* Header & Balance */
    .header {
      margin-top: 10px;
      text-align: center;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      color: #8E8E93;
      letter-spacing: 1px;
    }

    .balance-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    .balance {
      font-size: 36px;
      font-weight: 800;
    }

    .level-badge {
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      color: #34C759;
      margin-top: 6px;
    }

    /* Tap Area */
    .tap-area {
      position: relative;
      margin: 30px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .tap-button {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, #2c2c2e 0%, #1c1c1e 100%);
      border: 4px solid #34C759;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 30px rgba(52, 199, 89, 0.3);
      cursor: pointer;
      transition: transform 0.05s ease;
    }

    .tap-button:active {
      transform: scale(0.95);
    }

    .tap-button img {
      width: 140px;
      height: 140px;
      pointer-events: none;
    }

    /* Floating Animations */
    .floating-text {
      position: absolute;
      font-size: 28px;
      font-weight: bold;
      color: #34C759;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-80px); }
    }

    /* Progress & Energy (XP) Line */
    .progress-container {
      width: 100%;
      margin-bottom: 20px;
    }

    .energy-text {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #8E8E93;
      margin-bottom: 6px;
    }

    .progress-bar {
      width: 100%;
      height: 12px;
      background: #1c1c1e;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .progress-fill {
      height: 100%;
      background: #34C759;
      width: 0%;
      transition: width 0.2s ease;
    }

    /* Action Buttons */
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      margin-bottom: 12px;
    }

    .btn {
      background: #1c1c1e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active { background: #2c2c2e; }

    .btn-ads {
      width: 100%;
      background: linear-gradient(135deg, #FF9500 0%, #FF5E00 100%);
      color: #ffffff;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 149, 0, 0.3);
    }

    .btn-ads:active { opacity: 0.9; }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #1c1c1e;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close-btn {
      font-size: 24px;
      color: #8E8E93;
      cursor: pointer;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      color: #8E8E93;
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      background: #2c2c2e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: white;
      font-size: 14px;
      outline: none;
    }

    .submit-btn {
      width: 100%;
      background: #34C759;
      color: black;
      font-weight: bold;
      padding: 14px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    /* Task Item Styles */
    .task-item {
      background: #2c2c2e;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .task-title {
      font-weight: bold;
      font-size: 14px;
    }

    .task-reward {
      font-size: 12px;
      color: #34C759;
    }

    .task-action-btn {
      background: #34C759;
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .task-action-btn.claimed {
      background: #444;
      color: #8E8E93;
      cursor: default;
    }

    /* Admin View Specifics */
    #admin-view {
      display: none;
      width: 100%;
      max-width: 500px;
      padding: 20px;
    }

    .admin-card {
      background: #1c1c1e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .admin-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .user-id { font-weight: bold; color: #fff; }
    .amount-display { font-size: 18px; font-weight: bold; color: #34C759; margin: 8px 0; }
    .status-badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
    .status-badge.pending { background: rgba(255, 149, 0, 0.2); color: #ff9500; }
    .status-badge.approved, .status-badge.Approved { background: rgba(52, 199, 89, 0.2); color: #34C759; }
    .status-badge.rejected, .status-badge.Rejected { background: rgba(255, 59, 48, 0.2); color: #ff3b30; }

    .admin-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .action-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .approve-btn { background: #34C759; color: #000; }
    .reject-btn { background: #ff3b30; color: #fff; }
  </style>
</head>
<body>

  <!-- User Game View -->
  <div id="user-view" class="app-container">
    <div class="header">
      <div class="title">PEPE TAPPING</div>
      <div class="balance-container">
        <span class="balance" id="balance-display">0</span>
      </div>
      <div class="level-badge">Bronze Level</div>
    </div>

    <!-- Center Coin Logo Tap Area -->
    <div class="tap-area">
      <div class="tap-button" id="tap-btn">
        <img src="https://cryptologos.cc/logos/pepe-pepe-logo.png" alt="PEPE">
      </div>
    </div>

    <!-- 2000 XP Progress Bar -->
    <div class="progress-container">
      <div class="energy-text">
        <span>⚡ XP Line</span>
        <span id="energy-display">0 / 2000 XP</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="energy-bar"></div>
      </div>
    </div>

    <div class="actions-grid">
      <button class="btn" onclick="openModal('withdraw-modal')">💸 Withdraw</button>
      <button class="btn" onclick="openModal('task-modal')">🎯 Task</button>
    </div>

    <!-- Watch Ads Button (+200 XP) with Timer -->
    <button class="btn-ads" id="ad-btn" onclick="watchAdWithTimer()">🎬 Watch Ads (+200 XP)</button>
  </div>

  <!-- Task Modal -->
  <div class="modal" id="task-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Tasks</h3>
        <span class="close-btn" onclick="closeModal('task-modal')">&times;</span>
      </div>
      <div class="task-item">
        <div>
          <div class="task-title">Dogs Reffer</div>
          <div class="task-reward">+200 PEPE</div>
        </div>
        <button id="dogs-task-btn" class="task-action-btn" onclick="handleDogsTask()">Join</button>
      </div>
    </div>
  </div>

  <!-- Admin View -->
  <div id="admin-view">
    <h2 style="margin-bottom: 20px; text-align: center;">Withdrawal Requests</h2>
    <div id="admin-requests-list">Loading...</div>
  </div>

  <!-- Withdrawal Modal -->
  <div class="modal" id="withdraw-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Withdraw PEPE</h3>
        <span class="close-btn" onclick="closeModal('withdraw-modal')">&times;</span>
      </div>
      <div class="input-group">
        <label>Binance Pay ID / Wallet</label>
        <input type="text" id="binance-id-input" placeholder="e.g. 123456789">
      </div>
      <div class="input-group">
        <label>Amount (PEPE Tokens)</label>
        <input type="number" id="withdraw-amount-input" placeholder="Min 1,000">
      </div>
      <button class="submit-btn" onclick="submitWithdrawal()">Submit Request</button>
    </div>
  </div>

  <script>
    const BACKEND_URL = "https://pepe-backend-wkym.onrender.com";
    const ADSTERRA_LINK = "https://www.profitableratecpmnetwork.com/mag701y1?key=e6dcf81d34580abdf64766ac0be7e76d";
    const DOGS_TELEGRAM_LINK = "https://t.me/quickdogss_Bot?start=1912015558";

    // Game LocalStorage Keys
    let balance = parseInt(localStorage.getItem('pepe_balance')) || 0;
    let xp = parseInt(localStorage.getItem('pepe_xp'));
    if (isNaN(xp)) xp = 0; // Starts at 0 XP
    const maxXP = 2000;

    let isAdVerifying = false;

    // DOM Elements
    const balanceDisplay = document.getElementById('balance-display');
    const energyDisplay = document.getElementById('energy-display');
    const energyBar = document.getElementById('energy-bar');
    const tapBtn = document.getElementById('tap-btn');
    const adBtn = document.getElementById('ad-btn');

    updateUI();
    initTaskUI();

    // 1 Click = Deduct 10 XP, Add 1 PEPE Coin
    tapBtn.addEventListener('click', (e) => {
      if (xp < 10) {
        alert('Not enough XP! Watch Ads to get +200 XP.');
        return;
      }

      xp -= 10;
      balance += 1;

      saveState();
      updateUI();
      createFloatingText(e, "+1 PEPE");
    });

    // 1. WATCH AD WITH 5-SECOND VERIFICATION TIMER
    function watchAdWithTimer() {
      if (isAdVerifying) return;

      // Open Ad link in new tab
      window.open(ADSTERRA_LINK, '_blank');

      isAdVerifying = true;
      let timeLeft = 5;
      adBtn.innerText = `⏳ Verifying... (${timeLeft}s)`;
      adBtn.style.opacity = '0.7';

      const timer = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          adBtn.innerText = `⏳ Verifying... (${timeLeft}s)`;
        } else {
          clearInterval(timer);
          isAdVerifying = false;
          adBtn.innerText = "🎬 Watch Ads (+200 XP)";
          adBtn.style.opacity = '1';

          // Reward XP
          if (xp + 200 > maxXP) {
            xp = maxXP;
          } else {
            xp += 200;
          }
          saveState();
          updateUI();
          alert('Ad Verified! +200 XP added.');
        }
      }, 1000);
    }

    // 2. DOGS REFFER TASK LOGIC
    let dogsTaskStatus = localStorage.getItem('dogs_task_status') || 'join'; // 'join', 'claim', 'claimed'

    function initTaskUI() {
      const taskBtn = document.getElementById('dogs-task-btn');
      if (dogsTaskStatus === 'claim') {
        taskBtn.innerText = 'Claim';
        taskBtn.style.background = '#FF9500';
      } else if (dogsTaskStatus === 'claimed') {
        taskBtn.innerText = 'Claimed';
        taskBtn.classList.add('claimed');
        taskBtn.onclick = null;
      }
    }

    function handleDogsTask() {
      const taskBtn = document.getElementById('dogs-task-btn');

      if (dogsTaskStatus === 'join') {
        window.open(DOGS_TELEGRAM_LINK, '_blank');
        dogsTaskStatus = 'claim';
        localStorage.setItem('dogs_task_status', 'claim');
        taskBtn.innerText = 'Claim';
        taskBtn.style.background = '#FF9500';
      } else if (dogsTaskStatus === 'claim') {
        balance += 200;
        dogsTaskStatus = 'claimed';
        localStorage.setItem('dogs_task_status', 'claimed');
        saveState();
        updateUI();

        taskBtn.innerText = 'Claimed';
        taskBtn.classList.add('claimed');
        taskBtn.onclick = null;
        alert('Task Completed! +200 PEPE Coins added to your balance.');
      }
    }

    function updateUI() {
      balanceDisplay.innerText = balance.toLocaleString();
      energyDisplay.innerText = `${xp} / ${maxXP} XP`;
      energyBar.style.width = `${(xp / maxXP) * 100}%`;
    }

    function saveState() {
      localStorage.setItem('pepe_balance', balance);
      localStorage.setItem('pepe_xp', xp);
    }

    function createFloatingText(e, text) {
      const rect = tapBtn.getBoundingClientRect();
      const floatText = document.createElement('div');
      floatText.className = 'floating-text';
      floatText.innerText = text;
      floatText.style.left = `${e.clientX - rect.left}px`;
      floatText.style.top = `${e.clientY - rect.top}px`;

      tapBtn.appendChild(floatText);
      setTimeout(() => floatText.remove(), 800);
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // 3. WITHDRAWAL SUBMISSION (MINIMUM 1,000 PEPE)
    async function submitWithdrawal() {
      const binanceId = document.getElementById('binance-id-input').value.trim();
      const amount = parseInt(document.getElementById('withdraw-amount-input').value);

      if (!binanceId) return alert('Please enter Binance Pay ID');
      if (!amount || amount < 1000) return alert('Minimum withdrawal is 1,000 PEPE');
      if (amount > balance) return alert('Insufficient balance!');

      let userId = localStorage.getItem('user_id');
      if (!userId) {
        userId = 'USER_' + Math.floor(100000 + Math.random() * 900000);
        localStorage.setItem('user_id', userId);
      }

      try {
        const response = await fetch(`${BACKEND_URL}/api/withdraw`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: userId,
            binanceId: binanceId,
            wallet: binanceId,
            amount: amount,
            app: 'PEPE',
            type: 'PEPE'
          })
        });

        const data = await response.json();

        if (data.success) {
          balance -= amount;
          saveState();
          updateUI();
          closeModal('withdraw-modal');
          alert('PEPE withdrawal request submitted successfully!');
          document.getElementById('binance-id-input').value = '';
          document.getElementById('withdraw-amount-input').value = '';
        } else {
          alert('Error: ' + data.message);
        }
      } catch (error) {
        console.error("Submit error:", error);
        alert('Server Connection Error');
      }
    }

    // ---------------- ADMIN PANEL LOGIC (WORKING UNTOUCHED) ----------------
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('admin') === 'true') {
      document.getElementById('user-view').style.display = 'none';
      document.getElementById('admin-view').style.display = 'block';
      fetchAdminRequests();
    }

    async function fetchAdminRequests() {
      try {
        const res = await fetch(`${BACKEND_URL}/api/withdrawals`);
        const requests = await res.json();
        renderAdminRequests(requests);
      } catch (err) {
        console.error("Fetch Admin Error:", err);
        document.getElementById('admin-requests-list').innerText = 'Failed to load requests.';
      }
    }

    function renderAdminRequests(requests) {
      const container = document.getElementById('admin-requests-list');
      
      if (!requests || requests.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 20px; color: #8E8E93;">No pending requests</div>';
        return;
      }

      container.innerHTML = requests.map(req => {
        const walletDisplay = req.wallet || req.binance_id || req.binanceId || 'N/A';
        const currentStatus = req.status || 'Pending';

        const rawApp = req.app || req.type || req.appName || 'PEPE';
        const appLabel = rawApp.toString().toUpperCase().trim();

        let badgeColor = '#34C759'; 
        if (appLabel.includes('BONK')) {
          badgeColor = '#FF9500';  
        }

        return `
          <div class="admin-card">
            <div class="admin-card-header">
              <div style="display: flex; align-items: center; gap: 8px;">
                <span class="user-id">ID: ${walletDisplay}</span>
                <span style="
                  background-color: ${badgeColor}; 
                  color: #000; 
                  font-size: 11px; 
                  font-weight: bold; 
                  padding: 2px 8px; 
                  border-radius: 6px;
                  text-transform: uppercase;">
                  ${appLabel}
                </span>
              </div>
              <span class="status-badge ${currentStatus.toLowerCase()}">${currentStatus}</span>
            </div>
            
            <div class="amount-display">${Number(req.amount).toLocaleString()} ${appLabel}</div>
            
            ${currentStatus.toLowerCase() === 'pending' ? `
              <div class="admin-actions">
                <button class="action-btn approve-btn" onclick="updateStatus(${req.id}, 'Approved')">✓ Approve</button>
                <button class="action-btn reject-btn" onclick="updateStatus(${req.id}, 'Rejected')">✕ Reject</button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    async function updateStatus(id, newStatus) {
      try {
        const res = await fetch(`${BACKEND_URL}/api/withdrawals/update-status`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, status: newStatus })
        });
        const data = await res.json();
        if (data.success) {
          fetchAdminRequests();
        } else {
          alert('Failed: ' + data.message);
        }
      } catch (err) {
        alert('Failed to update status');
      }
    }
  </script>
</body>
</html>
